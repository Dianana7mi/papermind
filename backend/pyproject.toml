[project]
name = "papermind"
version = "0.1.0"
description = "Evidence-grounded scientific experiment research agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.38,<3", "asyncpg>=0.30,<1", "aiosqlite>=0.21,<1",
  "alembic>=1.15,<2", "redis>=5,<7", "celery[redis]>=5.4,<6",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "pwdlib[argon2]>=0.2,<1", "pyjwt>=2.10,<3",
  "qdrant-client>=1.14,<2", "rank-bm25>=0.2.2,<1",
  "langchain>=1,<2", "langchain-openai>=1,<2", "langgraph>=1,<2",
  "langfuse>=3,<4", "tenacity>=9,<10", "pypdf>=5,<7"
]

[project.optional-dependencies]
pdf = ["docling>=2.50,<3"]
local = ["sentence-transformers>=4,<6"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "reportlab>=4,<5", "matplotlib>=3.10,<4"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires external services or model assets", "live: invokes a real model API"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
