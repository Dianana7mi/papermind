# Optional infrastructure-only local development; API and Next run on the host.
name: papermind-dev
services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: papermind, POSTGRES_USER: papermind, POSTGRES_PASSWORD: local-development-only}
    ports: ['127.0.0.1:5432:5432']
    volumes: [dev_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7.4-alpine
    ports: ['127.0.0.1:6379:6379']
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports: ['127.0.0.1:6333:6333']
    volumes: [dev_qdrant:/qdrant/storage]
volumes:
  dev_pg:
  dev_qdrant:
